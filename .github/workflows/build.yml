name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Структура репозитория
        run: |
          echo “=== settings/build ===“
          find . -maxdepth 3 \( -name settings.gradle -o -name build.gradle -o -name gradle.properties \) -not -path ‘./.git/*’
          echo “=== java ===“
          find . -name “*.java” -not -path ‘./.git/*’ | head -20
          echo “PROJ=$(dirname “$(find . -name settings.gradle -not -path ‘./.git/*’ | head -1)”)” >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Сборка
        run: gradle build —console=plain
        working-directory: ${{ env.PROJ }}
      - name: Что получилось
        run: |
          pwd
          ls -la
          ls -R build | head -60
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: schoolboykeys-build
          path: ${{ env.PROJ }}/build/**
          if-no-files-found: warn

name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Найти проект
        run: |
          echo “PROJ=$(dirname “$(find . -name settings.gradle -not -path ‘./.git/*’ | head -1)”)” >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - run: gradle build
        working-directory: ${{ env.PROJ }}
      - name: Показать jar
        run: find . -name “*.jar” -not -path “*/.gradle/*” -not -path “*/.git/*”
      - uses: actions/upload-artifact@v4
        with:
          name: schoolboykeys-jar
          path: “**/build/libs/*.jar”
          if-no-files-found: error

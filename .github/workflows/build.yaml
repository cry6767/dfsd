name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          echo PROJ=$(dirname $(find . -name settings.gradle | head -1)) >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Build
        run: gradle build
        working-directory: ${{ env.PROJ }}
      - name: Show files
        run: find . -name \*.jar
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: schoolboykeys-jar
          path: ${{ env.PROJ }}/build/libs/*.jar
